---
layout: default
title: writing
section: writing
---
<div class="page-heading"><h1>writing</h1><img src="{{ '/assets/images/beetle.svg' | relative_url }}" alt="" width="42"></div><section class="paper"><label for="search">Find something in the notebook</label><input id="search" type="search" placeholder="Search writing…" autocomplete="off"><p id="search-status" role="status" class="muted"></p><div id="post-list">{% for post in site.posts %}<article class="post-row searchable" data-search="{{ post.title | append: ' ' | append: post.content | strip_html | escape }}"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time></article>{% else %}<p class="muted">The notebook is empty for now.</p>{% endfor %}</div></section>
